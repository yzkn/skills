# gitleaks 設定（claudecode-standalone-repos）
#
# 切り出し元 `claudecode-pm-starter-kit` の `.gitleaks.toml` を土台にし、このツリーの
# ディレクトリ構成（packages/<slug>/…）に合わせて allowlist のパスを読み替えたもの。
# 検出ルール（日本固有の個人情報・接続文字列等）は切り出し元と同一に保つ。
#
# 除外の方針は切り出し元と同じで、**パスではなく値を限定して除外する**ことを優先する
# （実在の値に対する検出能力を落とさないため。切り出し元 ADR-025 の方針）。

[extend]
useDefault = true

[[rules]]
id = "my-number"
description = "マイナンバー（個人番号・12桁）"
regex = '''\b\d{12}\b'''
keywords = ["マイナンバー", "個人番号", "my_number", "mynumber"]

[[rules]]
id = "corporate-number"
description = "法人番号（13桁）"
regex = '''\b[1-9]\d{12}\b'''
keywords = ["法人番号", "corporate_number", "houjin"]

[[rules]]
id = "credit-card"
description = "クレジットカード番号"
regex = '''\b(?:\d{4}[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}|\d{4}[ -]?\d{6}[ -]?\d{5})\b'''

[[rules]]
id = "fixed-phone-number"
description = "固定電話番号"
regex = '''0\d{1,4}-\d{1,4}-\d{4}'''
keywords = ["tel", "phone", "電話", "固定", "fax", "ファックス"]

[[rules]]
id = "mobile-phone-number"
description = "携帯電話番号"
regex = '''0[26789]0-?\d{4}-?\d{4}'''
keywords = ["携帯", "スマホ", "スマートフォン", "020", "060", "070", "080", "090"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API キー (sk-ant-...)"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{93}[A-Z]{2}'''
keywords = ["sk-ant"]

[[rules]]
id = "connection-string-password"
description = "接続文字列内のパスワード"
regex = '''(?i)(jdbc:|Data Source=|Server=)[^\s"']*[Pp]assword=[^;\s"']{4,}'''
keywords = ["jdbc", "datasource", "connectionstring"]

# 全桁 9 の連番ダミー。`claude-agent-data-modeler` の「コード表記の検討」でハイフン区切りの
# 例示として使っており、公開前チェックの文書でもその誤検出を説明するために引用している。
# credit-card ルールは区切り記号（空白・ハイフン）を許容するため、区切りの有無を問わず除外する。
# 値を限定した除外であり、実在のカード番号に対する検出能力は維持される。
[[allowlists]]
description = "全桁 9 のダミーカード番号（コード表記の説明で使った例示値）"
regexes = [
  '''9999[ -]?9999[ -]?9999[ -]?9999'''
]
rules = ["credit-card"]

# 連番のダミー値。切り出し元から引き継ぐ（規約・検出ルールの説明で使った例示値）。
[[allowlists]]
description = "連番のダミーカード番号（規約・検出ルールの説明で使った例示値）"
regexes = [
  '''1234[ -]?5678[ -]?9012[ -]?3456'''
]
rules = ["credit-card"]

# JavaScript の Number.MAX_SAFE_INTEGER（2^53-1）と 2^53 は 16 桁のため credit-card ルールに
# 一致してしまう。JSON Schema の maximum / minimum に頻出する定数であり、カード番号ではない
# （Luhn チェックも通らない）。切り出し元 ADR-025 の方針に従い値を限定して除外する。
[[allowlists]]
description = "2^53-1 (Number.MAX_SAFE_INTEGER) と 2^53 — JSON Schema の maximum/minimum 定数"
regexes = [
  '''9007199254740991''',
  '''9007199254740992'''
]
rules = ["credit-card"]

# 1/3 と 2/3 を IEEE754 の倍精度で書き下した循環小数。小数部が 16 桁の数字列になるため
# credit-card ルールに一致する（全桁同一で直前が "0." であり、カード番号ではない）。
[[allowlists]]
description = "1/3・2/3 の循環小数（トリガー評価の trigger_rate）"
regexes = [
  '''3333333333333333''',
  '''6666666666666666'''
]
rules = ["credit-card"]

# 局番 0000 は日本の電話番号として未割当であり、実在の加入者番号は一致しない。
# `/vnl testdata`（`claude-skill-vnl`）はこの帯だけを生成するため、生成したフィクスチャを
# そのままコミットできる。通常の局番を持つ番号の検出能力は維持される。
[[allowlists]]
description = "局番 0000（未割当）のダミー電話番号 — /vnl testdata が生成する形式"
regexes = [
  '''0\d{1,3}-?0000-?\d{4}'''
]
rules = ["mobile-phone-number", "fixed-phone-number"]

# ISBN-13 / EAN-13 の公知テスト値は 13 桁のため corporate-number ルール（\b[1-9]\d{12}\b）に
# 一致してしまう。`/vnl` の checkdigit selftest が実装検証に使う値であり、法人番号ではない。
[[allowlists]]
description = "ISBN-13 / EAN-13 の公知テスト値（checkdigit selftest の検証用）と連番のダミー値"
regexes = [
  '''9780306406157''',
  '''9780306406158''',
  '''1234567890123''',
  '''5012345678909'''
]
rules = ["corporate-number"]

# トリガー評価（`claude-script-skill-eval`）のフィクスチャに置くダミー JWT。
# 署名部は "not-a-real-signature" を Base64URL にした固定値で検証不能であり、秘密を含まない。
# 実測（gitleaks 8.30.1・[extend] useDefault = true）では既定ルールセットはこの値を検出しないが、
# 将来 jwt ルールが厳しくなった場合に備えて切り出し元から引き継ぐ。
[[allowlists]]
description = "トリガー評価フィクスチャのダミー JWT（署名は無効な固定値）"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiJldmFsLWZpeHR1cmUiLCJuYW1lIjoidHJpZ2dlciBldmFsIGZpeHR1cmUiLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MTgwMDAwMDAwMH0\.bm90LWEtcmVhbC1zaWduYXR1cmU'''
]
rules = ["jwt"]
