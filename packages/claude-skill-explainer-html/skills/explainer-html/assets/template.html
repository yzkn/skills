<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* =====================================================================
   explainer-html デザインシステム（外部リクエスト 0 件・自己完結）
   出典: mathbullet/skills の html スキル（MIT License）の document.css を
   土台に、Web フォント依存の排除・ダークモード対応・pandoc skylighting
   クラス対応・MathML 対応を加えて書き直したもの。
   ===================================================================== */

:root {
  --mb-bg: #FAF9F6;
  --mb-surface: #FFFFFF;
  --mb-ink: #111110;
  --mb-ink-body: #1A1A1A;
  --mb-border: #111110;
  --mb-rule: #DFDFDF;
  --mb-muted: #595959;
  --mb-faint: #A5A5A5;
  --mb-link: #2990DA;
  --mb-accent: #D63A2F;
  --mb-code-bg: #F1EFE9;
  --mb-diff-add-bg: #E6FFEC;
  --mb-diff-add-fg: #1A7F37;
  --mb-diff-del-bg: #FFEBE9;
  --mb-diff-del-fg: #CF222E;
  /* Web フォントを読み込まない。OS 同梱フォントへ順に解決する */
  --mb-font-sans: "Noto Sans JP", "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mb-font-mono: "Cascadia Mono", "Consolas", "SFMono-Regular", Menlo, "Noto Sans Mono", monospace;
  --mb-radius: 12px;
  --mb-border-w: 1.5px;
  color-scheme: light dark;
}

/* OS のダーク設定を既定の信号にする */
@media (prefers-color-scheme: dark) {
  :root {
    --mb-bg: #161614;
    --mb-surface: #1E1E1B;
    --mb-ink: #F2F1EC;
    --mb-ink-body: #E4E3DD;
    --mb-border: #4A4945;
    --mb-rule: #35342F;
    --mb-muted: #A9A79F;
    --mb-faint: #77756E;
    --mb-link: #6FB8EE;
    --mb-accent: #FF7A6E;
    --mb-code-bg: #26251F;
    --mb-diff-add-bg: #12331C;
    --mb-diff-add-fg: #4EC26E;
    --mb-diff-del-bg: #3A1A1A;
    --mb-diff-del-fg: #F0736B;
  }
}

/* 明示指定（ビューアのテーマ切替）は OS 設定より優先する */
:root[data-theme="light"] {
  --mb-bg: #FAF9F6; --mb-surface: #FFFFFF; --mb-ink: #111110; --mb-ink-body: #1A1A1A;
  --mb-border: #111110; --mb-rule: #DFDFDF; --mb-muted: #595959; --mb-faint: #A5A5A5;
  --mb-link: #2990DA; --mb-accent: #D63A2F; --mb-code-bg: #F1EFE9;
  --mb-diff-add-bg: #E6FFEC; --mb-diff-add-fg: #1A7F37;
  --mb-diff-del-bg: #FFEBE9; --mb-diff-del-fg: #CF222E;
}
:root[data-theme="dark"] {
  --mb-bg: #161614; --mb-surface: #1E1E1B; --mb-ink: #F2F1EC; --mb-ink-body: #E4E3DD;
  --mb-border: #4A4945; --mb-rule: #35342F; --mb-muted: #A9A79F; --mb-faint: #77756E;
  --mb-link: #6FB8EE; --mb-accent: #FF7A6E; --mb-code-bg: #26251F;
  --mb-diff-add-bg: #12331C; --mb-diff-add-fg: #4EC26E;
  --mb-diff-del-bg: #3A1A1A; --mb-diff-del-fg: #F0736B;
}

* { box-sizing: border-box; }

html { background: var(--mb-bg); }

body {
  margin: 0;
  background: var(--mb-bg);
  color: var(--mb-ink-body);
  font-family: var(--mb-font-sans);
  font-size: 16px;
  line-height: 1.9;
  font-feature-settings: "palt";
  -webkit-text-size-adjust: 100%;
}

/* ---- ページ骨格 ---------------------------------------------------- */

.mb-page { max-width: 1100px; margin: 0 auto; padding: 40px 48px 64px; }

.mb-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 48px;
  align-items: start;
}

.mb-main { min-width: 0; }

aside.mb-glossary {
  position: sticky;
  top: 24px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding-left: 24px;
  border-left: var(--mb-border-w) solid var(--mb-rule);
}

@media (max-width: 1000px) {
  .mb-page { padding: 24px 20px 48px; }
  .mb-wrap { display: block; }
  aside.mb-glossary {
    position: static; max-height: none; padding-left: 0;
    border-left: none; margin-bottom: 32px;
  }
}

.mb-footer { margin-top: 64px; font-size: 12px; color: var(--mb-faint); }

/* ---- 見出し --------------------------------------------------------- */

h1, h2, h3, h4 { color: var(--mb-ink); font-weight: 700; line-height: 1.45; margin: 0; }

h1 { font-size: 28px; border-left: 12px solid var(--mb-ink); padding-left: 18px; }
h2 { font-size: 22px; border-left: 10px solid var(--mb-ink); padding-left: 14px; margin: 56px 0 16px; }
h3 { font-size: 18px; margin: 36px 0 12px; }

.mb-lede { margin: 16px 0 0; font-size: 16.5px; }

.mb-meta-line {
  margin: 4px 0 0;
  font-family: var(--mb-font-mono);
  font-size: 13px;
  color: var(--mb-muted);
}

/* ---- 本文要素 -------------------------------------------------------- */

p { margin: 12px 0; }

a { color: var(--mb-link); text-decoration: none; }
a:hover { text-decoration: underline; }

strong { color: var(--mb-ink); }

/* 赤の強調は 1 ページ 1 箇所までとする（em を強調色として使う） */
em { font-style: normal; color: var(--mb-accent); font-weight: 700; }

ul, ol { padding-left: 1.6em; margin: 12px 0; }
ul { list-style: none; }
ul > li { position: relative; }

ul > li::before {
  content: "";
  position: absolute;
  left: -1.15em;
  top: 0.85em;
  width: 0.42em;
  height: 0.42em;
  border-radius: 50%;
  background: var(--mb-ink);
}

ul ul > li::before { width: 0.3em; height: 0.3em; top: 0.9em; background: var(--mb-muted); }

hr { border: none; border-top: var(--mb-border-w) solid var(--mb-rule); margin: 40px 0; }

/* ---- カード ---------------------------------------------------------- */

.mb-card {
  background: var(--mb-surface);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: var(--mb-radius);
  padding: 20px 24px;
  margin: 20px 0;
}

.mb-card > :first-child { margin-top: 0; }
.mb-card > :last-child { margin-bottom: 0; }

.mb-card-title {
  text-align: center;
  font-weight: 700;
  font-size: 17px;
  color: var(--mb-ink);
  border-bottom: var(--mb-border-w) solid var(--mb-border);
  margin: -20px -24px 16px;
  padding: 12px 24px;
}

/* .mb-card > :first-child の margin-top: 0 に負けないよう帯の食い込みを明示する */
.mb-card > .mb-card-title:first-child { margin-top: -20px; }

.mb-card-label { font-weight: 700; font-size: 14px; color: var(--mb-ink); margin: 0 0 8px; }

.mb-grid-2, .mb-grid-3 { display: grid; gap: 20px; align-items: stretch; margin: 20px 0; }
.mb-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mb-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mb-grid-2 > .mb-card, .mb-grid-3 > .mb-card { margin: 0; }

@media (max-width: 1000px) {
  .mb-grid-2, .mb-grid-3 { grid-template-columns: minmax(0, 1fr); }
}

/* ---- 要約ボックス ----------------------------------------------------- */

.mb-summary {
  background: var(--mb-surface);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: var(--mb-radius);
  padding: 20px 24px;
  margin: 24px 0;
}

.mb-summary::before {
  content: "要点";
  display: block;
  font-weight: 700;
  font-size: 14px;
  color: var(--mb-ink);
  margin-bottom: 8px;
}

.mb-summary > :last-child { margin-bottom: 0; }

/* ---- 目次 ------------------------------------------------------------ */

nav.mb-toc {
  background: var(--mb-surface);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: var(--mb-radius);
  padding: 16px 24px;
  margin: 24px 0;
}

nav.mb-toc ol { list-style: none; counter-reset: toc; margin: 0; padding: 0; }
nav.mb-toc > ol > li { counter-increment: toc; }

nav.mb-toc > ol > li::before {
  content: counter(toc, decimal-leading-zero);
  font-family: var(--mb-font-mono);
  color: var(--mb-muted);
  margin-right: 0.8em;
}

nav.mb-toc ol ol { padding-left: 2.6em; }
nav.mb-toc a { color: var(--mb-ink-body); }
nav.mb-toc a:hover { color: var(--mb-link); }

/* ---- チップ（並列の固有名・分類名の列挙にだけ使う） ---------------------- */

.mb-chip {
  display: inline-block;
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: 8px;
  padding: 0 0.6em;
  font-size: 14px;
  line-height: 1.7;
  background: var(--mb-surface);
  color: var(--mb-ink);
  margin: 2px;
}

/* ---- 引用（原文と訳文を同じ文字サイズ・色で上下に並べる） ----------------- */

blockquote.mb-quote {
  background: var(--mb-surface);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: var(--mb-radius);
  padding: 20px 28px;
  margin: 24px 0;
}

blockquote.mb-quote::before {
  content: "";
  display: block;
  width: 26px;
  height: 20px;
  margin-bottom: 8px;
  background: var(--mb-ink);
  -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 20"><path d="M0 20V11C0 5 3 1 9 0l1 3c-3 1-5 3-5 6h6v11H0zm15 0V11c0-6 3-10 9-11l1 3c-3 1-5 3-5 6h6v11H15z"/></svg>') no-repeat center / contain;
  mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 20"><path d="M0 20V11C0 5 3 1 9 0l1 3c-3 1-5 3-5 6h6v11H0zm15 0V11c0-6 3-10 9-11l1 3c-3 1-5 3-5 6h6v11H15z"/></svg>') no-repeat center / contain;
}

blockquote.mb-quote .mb-quote-original { margin: 0 0 14px; }

blockquote.mb-quote .mb-quote-ja {
  border-top: var(--mb-border-w) solid var(--mb-rule);
  padding-top: 14px;
  margin: 0;
}

blockquote.mb-quote .mb-quote-source {
  font-family: var(--mb-font-mono);
  font-size: 13px;
  margin: 12px 0 0;
}

/* ---- 用語リスト・表 ----------------------------------------------------- */

table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  background: var(--mb-surface);
  font-size: 14.5px;
  line-height: 1.7;
}

th, td {
  border: var(--mb-border-w) solid var(--mb-rule);
  padding: 8px 12px;
  text-align: left;
  vertical-align: top;
  overflow-wrap: break-word;
}

th { color: var(--mb-ink); border-bottom: var(--mb-border-w) solid var(--mb-border); background: var(--mb-surface); }

/* 行見出しのラベル列。折り返しを禁止し、残り幅を本文列へ譲る */
th.mb-rowlabel, td.mb-rowlabel { white-space: nowrap; }

/* 横に長い表は本文をはみ出させず、この枠内でスクロールさせる */
.mb-table-scroll { overflow-x: auto; margin: 16px 0; }
.mb-table-scroll > table { margin: 0; }

aside.mb-glossary h2 { border-left: none; padding-left: 0; font-size: 16px; margin: 0 0 12px; }
aside.mb-glossary table { font-size: 13.5px; }
aside.mb-glossary th, aside.mb-glossary td { padding: 6px 8px; }

/* ---- コード・等幅 ------------------------------------------------------ */

code, kbd, samp { font-family: var(--mb-font-mono); font-size: 0.92em; }

p code, li code, td code { background: var(--mb-code-bg); border-radius: 5px; padding: 0.08em 0.35em; }

pre {
  background: var(--mb-surface);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: var(--mb-radius);
  padding: 16px 20px;
  overflow-x: auto;
  line-height: 1.6;
  margin: 20px 0;
}

pre code { background: none; padding: 0; font-size: 13.5px; }

/* ---- シンタックスハイライト（pandoc skylighting のクラス） ----------------
   JS を読み込まない。pandoc がハイライト済みの <span class="..."> を
   出力するので、その機能色だけをここで定義する。
   ------------------------------------------------------------------------ */

pre.sourceCode, div.sourceCode { margin: 20px 0; }
div.sourceCode > pre { margin: 0; }
code.sourceCode > span { display: inline; }

/* コメント・注釈 */
code span.co, code span.do, code span.an, code span.cv, code span.in {
  color: var(--mb-muted); font-style: italic;
}
/* キーワード・制御構文・型・組み込み */
code span.kw, code span.cf, code span.dt, code span.bu {
  color: var(--mb-link); font-weight: 700;
}
/* 文字列・数値リテラル */
code span.st, code span.ch, code span.vs, code span.ss,
code span.dv, code span.bn, code span.fl, code span.sc {
  color: var(--mb-accent);
}
/* 関数名・定数・属性 */
code span.fu, code span.cn, code span.at { color: var(--mb-ink); font-weight: 700; }
/* 変数・演算子・その他 */
code span.va, code span.op, code span.pp, code span.ex { color: var(--mb-ink-body); }
/* エラー・警告 */
code span.er, code span.wa { color: var(--mb-accent); text-decoration: underline; }

/* ---- 図 ---------------------------------------------------------------- */

figure.mb-figure { margin: 24px 0; text-align: center; }

figure.mb-figure svg { max-width: 100%; height: auto; }

/* 自作図は黒一色の線画を基本とする。ダーク時に線が消えないよう反転させる */
.mb-figure-frame svg { color: var(--mb-ink); }
.mb-figure-frame svg [stroke="#000"], .mb-figure-frame svg [stroke="black"] { stroke: currentColor; }
.mb-figure-frame svg [fill="#000"], .mb-figure-frame svg [fill="black"] { fill: currentColor; }

figure.mb-figure img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 6px; }

figure.mb-figure figcaption {
  font-family: var(--mb-font-mono);
  font-size: 13px;
  color: var(--mb-muted);
  margin-top: 8px;
  text-align: center;
}

.mb-figure-frame {
  background: var(--mb-surface);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: var(--mb-radius);
  padding: 24px;
}

/* ---- コード差分（緑・赤は意味を区別する機能色。1 ページ 1 箇所の制限外） ---- */

pre.mb-diff {
  padding: 12px 0;
  /* span 間の改行テキストノードが空行にならないよう、行スパン側だけ pre にする */
  white-space: normal;
}

pre.mb-diff .add, pre.mb-diff .del, pre.mb-diff .ctx {
  display: block;
  white-space: pre;
  padding: 1px 20px 1px 8px;
}

pre.mb-diff .add::before, pre.mb-diff .del::before, pre.mb-diff .ctx::before {
  display: inline-block;
  width: 1.4em;
  color: var(--mb-muted);
}

pre.mb-diff .add { background: var(--mb-diff-add-bg); }
pre.mb-diff .add::before { content: "+"; color: var(--mb-diff-add-fg); }
pre.mb-diff .del { background: var(--mb-diff-del-bg); }
pre.mb-diff .del::before { content: "-"; color: var(--mb-diff-del-fg); }
pre.mb-diff .ctx::before { content: " "; }

/* ---- 数式（MathML。外部ライブラリを読み込まない） ------------------------ */

math { font-size: 1.05em; }
math[display="block"] { display: block; margin: 0 auto; overflow-x: auto; }

.mb-math-block { position: relative; margin: 20px 0; text-align: center; }

.mb-math-copy {
  font-family: var(--mb-font-mono);
  font-size: 12px;
  line-height: 1.5;
  padding: 1px 8px;
  background: var(--mb-surface);
  color: var(--mb-ink);
  border: var(--mb-border-w) solid var(--mb-border);
  border-radius: 8px;
  cursor: pointer;
}

.mb-math-copy:hover { background: var(--mb-rule); }

.mb-math-block > .mb-math-copy { position: absolute; top: 50%; right: 0; transform: translateY(-50%); }

.mb-math-inline > .mb-math-copy { display: none; margin-left: 4px; vertical-align: middle; }
.mb-math-inline:hover > .mb-math-copy,
.mb-math-inline:focus-within > .mb-math-copy { display: inline-block; }

/* ---- 印刷 --------------------------------------------------------------- */

@media print {
  @page { size: A4; margin: 15mm; }

  html, body {
    font-size: 10.5pt;
    line-height: 1.55;
    background: #FFFFFF;
    color: #000000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* 印刷はダーク配色を持ち込まない */
  :root {
    --mb-bg: #FFFFFF; --mb-surface: #FFFFFF; --mb-ink: #000000; --mb-ink-body: #1A1A1A;
    --mb-border: #000000; --mb-rule: #CCCCCC; --mb-muted: #555555; --mb-code-bg: #F1EFE9;
  }

  .mb-page { max-width: none; padding: 0; }
  .mb-wrap { display: block; }

  aside.mb-glossary {
    position: static; max-height: none; overflow: visible;
    padding-left: 0; border-left: none;
    margin-top: 24px; padding-top: 16px; border-top: 2px solid #000;
    break-before: page; page-break-before: always;
  }

  h1, h2, h3, h4 { break-after: avoid; page-break-after: avoid; }

  .mb-card, .mb-summary, blockquote.mb-quote, figure.mb-figure,
  nav.mb-toc, table, tr, pre, .mb-lede {
    break-inside: avoid; page-break-inside: avoid;
  }

  .mb-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  a { color: #000; text-decoration: none; }
  a[href^="http"]::after {
    content: " (" attr(href) ")";
    font-size: 0.85em;
    font-family: var(--mb-font-mono);
    word-break: break-all;
  }

  .mb-math-copy { display: none; }
}
</style>
</head>
<body>
<div class="mb-page">
  <h1>{{TITLE}}</h1>
  <p class="mb-lede">{{LEDE}}</p>
  <p class="mb-meta-line">{{YYYY-MM-DD}}</p>

  <nav class="mb-toc" aria-label="目次">
    <ol>
      <li><a href="#s1">{{見出し 1}}</a></li>
      <li><a href="#s2">{{見出し 2}}</a></li>
    </ol>
  </nav>

  <div class="mb-wrap">
    <main class="mb-main">
      <h2 id="s1">{{見出し 1}}</h2>
      <p>{{本文}}</p>

      <h2 id="s2">{{見出し 2}}</h2>
      <p>{{本文}}</p>
    </main>

    <aside class="mb-glossary">
      <h2>用語</h2>
      <table>
        <thead><tr><th>用語</th><th>説明</th></tr></thead>
        <tbody>
          <tr><td class="mb-rowlabel">{{用語}}</td><td>{{1〜2 文の定義}}</td></tr>
        </tbody>
      </table>
    </aside>
  </div>

  <p class="mb-footer">{{出典・作成日・注記}}</p>
</div>

<script>
// 数式の LaTeX 原文をコピーする。対象は data-latex を持つ要素のみ。
// 外部ライブラリを使わない（MathML はブラウザがネイティブ描画する）。
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('[data-latex]').forEach(function (host) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mb-math-copy';
    btn.textContent = 'LaTeX';
    btn.setAttribute('aria-label', 'LaTeX 原文をコピー');
    btn.addEventListener('click', function () {
      var src = host.getAttribute('data-latex');
      var done = function () {
        btn.textContent = 'copied';
        setTimeout(function () { btn.textContent = 'LaTeX'; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(src).then(done, function () { fallback(src, done); });
      } else {
        fallback(src, done);
      }
    });
    host.appendChild(btn);
  });

  // file:// で開いた場合など Clipboard API が使えない環境向けの退避手段
  function fallback(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* 失敗時は何もしない */ }
    document.body.removeChild(ta);
  }
});
</script>
</body>
</html>
